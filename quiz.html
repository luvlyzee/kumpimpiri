<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Love Quiz 🧠✨</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }
        h1, h2, h3, h5, h6 {
            font-family: 'Playfair Display', serif !important;
        }
    </style>
</head>
<body class="bg-[radial-gradient(circle_at_center,_var(--color-rose-100)_0%,_var(--color-rose-50)_40%,_var(--color-white)_100%)] min-h-screen flex flex-col items-center justify-start py-8 px-4 font-sans selection:bg-rose-100 selection:text-rose-600">
    
    <script>
        if (localStorage.getItem('isLoveLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>

    <div class="max-w-md w-full text-center relative">
        
        <div id="error-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white p-6 rounded-[2rem] border-2 border-red-500 max-w-xs w-full text-center shadow-2xl transition-all transform scale-100 animate-bounce">
                <div class="inline-flex p-3 rounded-full bg-red-50 text-red-500 mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-8 h-8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
                    </svg>
                </div>
                <h3 class="text-red-600 font-black text-xl mb-1 tracking-tight">ULITIN MOOOO!!</h3>
                <h3 class="text-red-600 font-black text-xl mb-4 tracking-tight">MALIIII!! 😤</h3>
                <button onclick="closeErrorModal()" class="w-full py-2 bg-gradient-to-r from-red-500 to-rose-500 text-white text-xs font-bold rounded-full uppercase tracking-wider shadow-md active:scale-95 transition-all cursor-pointer">
                    Subukan Ulit 🥺
                </button>
            </div>
        </div>

        <div id="quiz-container">
            <h1 class="text-3xl font-black text-rose-600 mb-1 italic">how well do you know me?</h1>
            <p class="text-slate-500 text-xs mb-8">saguten ng ayos! 🧠✨</p>

            <div class="bg-white/90 p-6 rounded-[2rem] shadow-xl border border-rose-100 text-center mb-6 backdrop-blur-sm">
                
                <div class="w-full bg-slate-100 h-2 rounded-full mb-6 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-rose-400 to-red-500 h-full w-[16.6%] transition-all duration-300"></div>
                </div>
                
                <span id="question-number" class="text-[10px] font-bold tracking-widest text-rose-500 uppercase px-2.5 py-0.5 bg-rose-50 rounded-full">Question 1 of 6</span>
                
                <h2 id="question-text" class="text-slate-800 font-black text-xl mt-4 mb-8 leading-snug">
                    Ano ang aking paboritong kulay? 🎨
                </h2>

                <div id="options-container" class="space-y-3 w-full max-w-xs mx-auto"></div>
            </div>
        </div>

        <div id="success-card" class="hidden bg-white/90 p-8 rounded-[2rem] shadow-xl border border-rose-100 text-center backdrop-blur-sm transform scale-100 transition-all duration-500">
            <div class="inline-flex p-4 rounded-full bg-emerald-50 text-emerald-500 mb-4 animate-pulse">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-10 h-10">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.745 3.745 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
                </svg>
            </div>
            <h2 class="text-2xl font-black text-slate-800 mb-2">Perfect Score! 🥳💍</h2>
            <p class="text-slate-500 text-sm mb-8 leading-relaxed">Kilalang-kilala ako hah! Dahil dyan, may premyo ka sa akin mamaya! </p>
            
            <button onclick="goToDashboard()" class="inline-block text-xs font-bold uppercase tracking-wider text-rose-500 bg-white px-6 py-3 rounded-full border border-rose-200 shadow-sm transition-transform active:scale-95 cursor-pointer">
                Balik sa Dashboard 🏠
            </button>
        </div>

        <a id="back-menu-btn" href="index.html" class="inline-block mt-4 text-xs font-bold uppercase tracking-wider text-rose-500 bg-white px-5 py-2.5 rounded-full border border-rose-200 shadow-sm transition-transform duration-200 active:scale-95 cursor-pointer">
            ← Back to Menu
        </a>
    </div>

    <script>
        // TEH, INAYOS KO NA YUNG INDEXES NG CORRECT ANSWERS BASE SA PINALITAN MONG OPTIONS
        const quizData = [
            {
                question: "Ano ang aking paboritong kulay? 🎨",
                options: ["Pink / Rose", "Red / Pula", "Lavender / Purple", "Sky Blue"],
                correct: 2 // Naka-set sa Lavender / Purple base sa file mo
            },
            {
                question: "Ano naman ang paborito kong ulam? 🍛",
                options: ["Sinigang na Baboy", "Tapa", "Embutido", "Hipon"],
                correct: 3 
            },
            {
                question: "Alin ang pinakamabilis magpapainit ng ulo ko? 😤",
                options: ["Init", "Gutom", "Traffic", "Late na Pagdating"],
                correct: 0 
            },
            {
                question: "Ano ang pinaka-kailangan ko palagi bilang isang IT student? 💻",
                options: ["Kape at Matinding Pasensya", "Bagong Mechanical Keyboard", "Gaming Mouse Pad", "Unlimited Cheatsheets"],
                correct: 0 // Kape at Matinding Pasensya (Index 0)
            },
            {
                question: "Ano ang cravings ko palagi? 🍰",
                options: ["Samgyupsal / Meat", "Buldak", "French Fries at Burger", "Milktea at Shawarma"],
                correct: 1 // Buldak (Index 1)
            },
            {
                question: "Sino ang paborito kong pusa? 🐱",
                options: ["Tyra", "Theo", "Loonie", "Zein"],
                correct: 2 // Loonie (Index 2)
            }
        ];

        let currentStep = 0;

        function loadQuestion() {
            if (currentStep >= quizData.length) {
                // Sine-save na agad ang validation flag kapag nakarating sa dulo
                localStorage.setItem('quizPassed', 'true');
                
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('back-menu-btn').classList.add('hidden');
                
                const successCard = document.getElementById('success-card');
                successCard.classList.remove('hidden');
                return;
            }

            const currentData = quizData[currentStep];
            
            document.getElementById('question-number').innerText = `Question ${currentStep + 1} of ${quizData.length}`;
            document.getElementById('question-text').innerText = currentData.question;
            
            const progressPercent = ((currentStep + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            currentData.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.innerText = option;
                btn.className = "w-full py-3.5 px-5 bg-slate-50 border border-slate-200/80 rounded-2xl text-slate-700 font-semibold text-sm text-center shadow-sm hover:bg-rose-50 hover:border-rose-200 hover:text-rose-600 active:scale-[0.98] transition-all duration-200 cursor-pointer text-left";
                btn.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex) {
            const currentData = quizData[currentStep];
            
            if (selectedIndex === currentData.correct) {
                currentStep++;
                loadQuestion();
            } else {
                document.getElementById('error-modal').classList.remove('hidden');
            }
        }

        function closeErrorModal() {
            document.getElementById('error-modal').classList.add('hidden');
        }

        // REDIRECTION ENGINE: Eto yung magpapalit sa index.html smoothly habang dala ang true value
        function goToDashboard() {
            localStorage.setItem('quizPassed', 'true');
            window.location.replace('index.html');
        }

        loadQuestion();
    </script>
</body>
</html>
