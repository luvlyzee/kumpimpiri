<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear Love ✉️</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }
        h1, h2, h3, h5, h6, .romantic-title {
            font-family: 'Playfair Display', serif !important;
        }
        /* Custom smooth appearance para sa fade-in elements */
        .fade-in-element {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .fade-in-element.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-[radial-gradient(circle_at_center,_var(--color-rose-100)_0%,_var(--color-rose-50)_40%,_var(--color-white)_100%)] min-h-screen flex flex-col items-center justify-start py-8 px-4 font-sans selection:bg-rose-100 selection:text-rose-600">
    
    <script>
        if (localStorage.getItem('isLoveLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>

    <div class="max-w-md w-full text-center">
        <h1 class="text-3xl font-black text-rose-600 mb-2 italic">a little message for you</h1>
        <p class="text-slate-500 text-sm mb-6">read this baby hihi✨</p>

        <div class="bg-white/90 p-6 rounded-[2rem] shadow-xl border border-rose-100 text-left space-y-4 mb-6 backdrop-blur-sm relative overflow-hidden">
            
            <div class="absolute top-4 right-5 text-rose-200 text-3xl opacity-60 animate-pulse">✉️</div>

            <span class="text-rose-500 font-bold text-xs uppercase tracking-widest block">To my Ilyo,</span>
            
            <div id="typewriter-text" class="text-slate-600 text-sm leading-relaxed min-h-[120px] font-medium"></div>
            
            <div id="letter-signature" class="fade-in-element text-right text-rose-500 font-serif italic text-sm font-bold pt-2">
                Your cutest bb, tinay 🤍
            </div>
        </div>

        <div id="secret-surprise-section" class="fade-in-element hidden mb-6">
            <p class="text-xs text-rose-400 font-semibold mb-2 animate-pulse">Wait, meron pa...... 🫣❤️</p>
            <a href="surprise.html" class="w-full py-4 px-6 inline-flex items-center justify-center gap-2 bg-gradient-to-r from-rose-500 via-pink-500 to-red-500 text-white font-black text-sm rounded-2xl uppercase tracking-wider shadow-lg hover:shadow-rose-200 active:scale-95 transition-all animate-[bounce_2s_infinite] cursor-pointer">
                💝 OPEN MY MAIN SURPRISE 💝
            </a>
        </div>

        <a href="index.html" class="inline-block text-xs font-bold uppercase tracking-wider text-rose-500 bg-white px-5 py-2.5 rounded-full border border-rose-200 shadow-sm transition-transform duration-200 active:scale-95 cursor-pointer">
            ← Back to Menu
        </a>
    </div>

    <script>
        const messageToLove = "Hi babyy!! Di ko talaga alam sasabihin ko, pero mahal kita super. Salamat sa lahat ng ginagawa mo for me. Sa pagtulong sa pusa, sa pagtulong sa gawaing bahay, sa pagiging one call away. Sobra kitang na-aappreciate sa lahat ng ginagawa mo at sa lahat ng effort mo. I love you so much! ❤️";
        
        // BINAGO ITO TEH: Mula 40 ginawa nating 20 para mas mabilis mag-type ang lyrics mo!
        const speed = 20; 
        let index = 0;

        function typeWriter() {
            if (index < messageToLove.length) {
                document.getElementById("typewriter-text").innerHTML += messageToLove.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            } else {
                // Pagkatapos mag-type, lalabas smoothly ang signature at secret button
                setTimeout(() => {
                    document.getElementById("letter-signature").classList.add("visible");
                    
                    const surpriseSection = document.getElementById("secret-surprise-section");
                    surpriseSection.classList.remove("hidden");
                    setTimeout(() => {
                        surpriseSection.classList.add("visible");
                    }, 50);
                }, 400); // Binawasan ko rin ang delay dito para pasok agad ang button!
            }
        }

        // Simulan agad ang typing animation pagkabukas ng file
        window.onload = function() {
            typeWriter();
        };
    </script>
</body>
</html>
