<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love | Dashboard ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }
        h1, h2, h3, .menu-title {
            font-family: 'Playfair Display', serif !important;
        }
    </style>
</head>
<body class="bg-[radial-gradient(circle_at_center,_var(--color-rose-100)_0%,_var(--color-rose-50)_40%,_var(--color-white)_100%)] min-h-screen flex flex-col items-center justify-center font-sans antialiased overflow-x-hidden selection:bg-rose-100 selection:text-rose-600">

    <script>
        if (localStorage.getItem('isLoveLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>

    <div id="quiz-warning-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-[2rem] border-2 border-rose-300 max-w-xs w-full text-center shadow-2xl transition-all transform scale-100">
            <div class="inline-flex p-3 rounded-full bg-rose-50 text-rose-500 mb-3 animate-bounce">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-8 h-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
            </div>
            <h3 class="text-slate-800 font-black text-xl mb-1 tracking-tight">OPS, BAWAL PA! 🫣</h3>
            <p class="text-slate-500 text-xs mb-4 leading-relaxed">Sagutan mo muna ang quiz nang tama bago mo mabasa ang sulat ko! 😤❤️</p>
            <button onclick="closeWarningModal()" class="w-full py-2.5 bg-gradient-to-r from-rose-500 to-red-500 text-white text-xs font-bold rounded-full uppercase tracking-wider shadow-md active:scale-95 transition-all cursor-pointer">
                okeh prinsesa ko, quiz muna!
            </button>
        </div>
    </div>

    <div class="max-w-md w-full mx-auto px-4 py-8 text-center">
        
        <h1 class="text-3xl font-black tracking-tight bg-gradient-to-r from-rose-500 to-red-600 bg-clip-text text-transparent mb-1 italic">
            Hello, My Love! 🤍
        </h1>
        <p class="text-slate-500 text-xs mb-8">Pick one muna okay!!!!</p>

        <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto mb-8">
            
            <a href="images.html" class="group relative block aspect-square rounded-3xl overflow-hidden bg-white border border-rose-100 shadow-md shadow-rose-100/30 transition-all duration-300 active:scale-95">
                <img src="https://i1-c.pinimg.com/736x/a4/69/13/a469138142130e3d5750292d92b4a563.jpg" alt="Memories" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent flex items-end justify-center pb-3 px-2">
                    <span class="text-white font-bold text-xs tracking-wide shadow-sm">📸 Our Photos</span>
                </div>
            </a>

            <a href="music.html" class="group relative block aspect-square rounded-3xl overflow-hidden bg-white border border-rose-100 shadow-md shadow-rose-100/30 transition-all duration-300 active:scale-95">
                <img src="https://i1-c.pinimg.com/1200x/0f/e9/a8/0fe9a8aa8a6ba4cb2a10b52c7567ff3d.jpg" alt="Cats" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent flex items-end justify-center pb-3 px-2">
                    <span class="text-white font-bold text-xs tracking-wide shadow-sm">🎵 Music for You</span>
                </div>
            </a>

            <a href="quiz.html" class="group relative block aspect-square rounded-3xl overflow-hidden bg-white border border-rose-100 shadow-md shadow-rose-100/30 transition-all duration-300 active:scale-95">
                <img src="https://i.pinimg.com/736x/81/2e/68/812e68788feac19d9a913a1fd51f868c.jpg" alt="Foods" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent flex items-end justify-center pb-3 px-2">
                    <span class="text-white font-bold text-xs tracking-wide shadow-sm">🎮 Quiz Time</span>
                </div>
            </a> 

            <a href="letters.html" id="letters-link" onclick="handleLettersClick(event)" class="group relative block aspect-square rounded-3xl overflow-hidden bg-white border border-rose-100 shadow-md shadow-rose-100/30 transition-all duration-300 active:scale-95 opacity-60">
                <img src="https://i.pinimg.com/736x/35/16/a6/3516a6779b1457022836dae20313122f.jpg" alt="Letter" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent flex items-end justify-center pb-3 px-2">
                    <span id="letters-text" class="text-white font-bold text-xs tracking-wide shadow-sm flex items-center gap-1">🔒 Dear Love</span>
                </div>
            </a>

        </div>

        <button onclick="logout()" class="text-xs font-semibold text-slate-400 hover:text-rose-500 transition-colors bg-white/60 px-4 py-2 rounded-full border border-slate-100 shadow-sm cursor-pointer">
            🔒 Lock App
        </button>
    </div>

    <script>
        function checkQuizStatus() {
            const lettersLink = document.getElementById('letters-link');
            const lettersText = document.getElementById('letters-text');
            
            if (localStorage.getItem('quizPassed') === 'true') {
                lettersLink.classList.remove('opacity-60');
                lettersText.innerHTML = "✉️ Dear Love";
            }
        }

        function handleLettersClick(event) {
            if (localStorage.getItem('quizPassed') !== 'true') {
                event.preventDefault(); 
                document.getElementById('quiz-warning-modal').classList.remove('hidden');
            }
        }

        function closeWarningModal() {
            document.getElementById('quiz-warning-modal').classList.add('hidden');
        }

        function logout() {
            localStorage.removeItem('isLoveLoggedIn');
            localStorage.removeItem('quizPassed'); 
            window.location.href = 'login.html';
        }

        // Automatic window trigger validation sequence
        window.onload = checkQuizStatus;
    </script>
</body>
</html>
